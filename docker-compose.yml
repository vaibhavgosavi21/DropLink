services:

  mysql:
    image: mysql:8.0
    container_name: droplink-mysql
    environment:
      MYSQL_DATABASE: fileshare
      MYSQL_USER: ${DB_USERNAME:-droplink}
      MYSQL_PASSWORD: ${DB_PASSWORD:-droplink}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: droplink-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/fileshare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-droplink}
      DB_PASSWORD: ${DB_PASSWORD:-droplink}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      FILE_MAX_SIZE: ${FILE_MAX_SIZE:-500MB}
    volumes:
      - uploads_data:/app/storage
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: droplink-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  mysql_data:
  uploads_data:

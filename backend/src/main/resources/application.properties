spring.application.name=fileshare
spring.profiles.active=dev

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${FILE_MAX_SIZE:500MB}
spring.servlet.multipart.max-request-size=${FILE_MAX_SIZE:500MB}

# File upload config
file.upload.max-size=524288000
file.storage.type=local
file.storage.local.upload-dir=storage/uploads
file.storage.local.temp-dir=storage/temp

# Share URL base (override in prod)
app.share.base-url=${APP_BASE_URL:http://localhost:5173}
